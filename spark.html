function levelUp(l,n){toast(`Naik ke Lv ${l}: ${LV[l-1]}${n?` · ${n} item baru`:""}`);burst();setTimeout(burst,220);if(y===0){vy=Math.sqrt(2*G*40);qv-=.8}
 if(S.emo!="Celebrating"){EB=S.emo;S.emo="Celebrating";draw();setTimeout(()=>{if(S.emo=="Celebrating"&&EB){S.emo=EB;EB=null;draw()}},2800)}}
const dk=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(),day=()=>dk(new Date());
function ciUpd(){const b=$("ci");if(!b)return;const d=S.last==day();b.textContent=d?"Sudah nyala ✓":"Nyalakan hari ini";b.classList.toggle("done",d)}
function checkin(){const t=day();if(S.last==t)return toast("Hari ini sudah nyala 🔥");
 const kept=!S.last||S.last==dk(new Date(Date.now()-864e5));S.days=kept?S.days+1:1;S.last=t;
 const g=100+Math.min(S.days,10)*10;S.xp=Math.min(5500,S.xp+g);toast(kept?`+${g} XP · ${S.days} hari nyala`:`Streak putus, mulai lagi dari 1 · +${g} XP`);draw();if(TABS[tab][1]!="xp")ui();bump()}
let SEEN=new Set(),SEED=1;
function seedSeen(){if(SEED)TABS.forEach(t=>t[2].filter(unl).forEach(v=>SEEN.add(v)))}
function tabsUpd(){[...$("tabs").children].forEach((b,i)=>b.classList.toggle("nw",TABS[i][2].some(v=>unl(v)&&!SEEN.has(v))))}
const HS=[],snap=()=>JSON.stringify({a:["theme","outfit","head","face","emo"].map(k=>S[k]),x:[...S.extra]});
function undoUpd(){$("undo").disabled=!HS.length}
function snapPush(){HS.push(snap());if(HS.length>30)HS.shift();undoUpd()}
function undo(){const d=HS.pop();if(!d)return;const o=JSON.parse(d);["theme","outfit","head","face","emo"].forEach((k,i)=>S[k]=o.a[i]);S.extra=new Set(o.x);EB=null;draw();mark();undoUpd();hap();toast("Dibatalkan")}
const HK="punkshit.spark.hint",STEPS=[["Tap avatarnya, dia bakal loncat.","#tilt",1],["Ketuk nama buat ganti. JEX × KEN juga bisa diedit.","#nm"],["Tarik panel ke atas buat lihat lebih banyak item.","#grab"]];
function coach(i){const c=$("coach");document.querySelectorAll(".pulse").forEach(e=>e.classList.remove("pulse"));
 if(i>=STEPS.length){c.classList.remove("on");try{localStorage.setItem(HK,"1")}catch(_){}return}
 const [t,sel,hop]=STEPS[i];$("cp").textContent=t;$("cn").textContent=i==STEPS.length-1?"Mengerti":"Lanjut";c.classList.add("on");if(!hop)document.querySelector(sel).classList.add("pulse");if(hop)bump();$("cn").onclick=()=>coach(i+1)}
function startCoach(){try{if(!localStorage.getItem(HK))setTimeout(()=>coach(0),900)}catch(_){}}
$("coach").addEventListener("pointerdown",e=>e.stopPropagation());
(()=>{const g=$("grab"),sh=document.querySelector(".sheet"),cd=document.querySelector(".card");let y0=0,h0=0,dr=0;
 g.addEventListener("pointerdown",e=>{dr=1;y0=e.clientY;h0=sh.offsetHeight;sh.classList.add("dragging");g.setPointerCapture(e.pointerId)});
 g.addEventListener("pointermove",e=>{if(dr)sh.style.setProperty("--sh",Math.max(200,Math.min(cd.offsetHeight*.72,h0+y0-e.clientY))+"px")});
 const end=e=>{if(!dr)return;dr=0;sh.classList.remove("dragging");const H=cd.offsetHeight,c=sh.offsetHeight,tap=Math.abs(e.clientY-y0)<4,sn=[.3,.42,.7].map(r=>r*H);
  sh.style.setProperty("--sh",(tap?(c<H*.5?H*.7:H*.42):sn.reduce((a,b)=>Math.abs(b-c)<Math.abs(a-c)?b:a))+"px")};
 g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end)})();
$("shot").onclick=shot;$("ci").onclick=checkin;$("undo").onclick=undo;
load();seedSeen();tabsInit();draw();ui();requestAnimationFrame(step);startCoach();

// Sinkronisasi otomatis Nama, Streak, & XP dari kartu PunkID PUNKSHIT.OS
window.addEventListener("message", (ev) => {
  if (ev.data && ev.data.type === "PUNK_SYNC" && ev.data.user) {
    const u = ev.data.user;
    if (u.name && $("nm").textContent === "BARA") {
      $("nm").textContent = String(u.name).slice(0, 14).toUpperCase();
    }
    if (typeof u.streak === "number" && u.streak > S.days) {
      S.days = u.streak;
    }
    if (typeof u.cred === "number") {
      S.xp = Math.min(5500, Math.max(S.xp, u.cred * 10));
    }
    draw();
    ui();
  }
});
