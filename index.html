<body>
  <div class="phone" id="ph">
    <!-- Wallpaper & Interactive Dynamic Island -->
    <div class="wall" id="ph-wall"></div>
    <script>
      (function () {
        try {
          var th = localStorage.getItem('punk_os_theme_active') || '';
          if (!th) {
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && k.indexOf('punk_os_theme_') === 0) {
                var v = localStorage.getItem(k);
                if (v) { th = v; break; }
              }
            }
          }
          var map = {
            'theme-sakura': {
              cls: 'theme-sakura',
              accent: '#f472b6',
              wall: 'radial-gradient(circle at 20% 18%, rgba(244,114,182,.38), transparent 52%), radial-gradient(circle at 82% 78%, rgba(192,132,252,.32), transparent 55%), linear-gradient(160deg, #1e1024 0%, #120b1c 100%)'
            },
            'theme-carbon': {
              cls: 'theme-carbon',
              accent: '#38bdf8',
              wall: 'radial-gradient(circle at 75% 15%, rgba(56,189,248,.22), transparent 50%), radial-gradient(circle at 15% 85%, rgba(71,85,105,.35), transparent 55%), linear-gradient(165deg, #090d16 0%, #05070c 100%)'
            },
            'theme-mint': {
              cls: 'theme-mint',
              accent: '#34d399',
              wall: 'radial-gradient(circle at 22% 20%, rgba(52,211,153,.32), transparent 52%), radial-gradient(circle at 80% 75%, rgba(34,211,238,.26), transparent 55%), linear-gradient(160deg, #071c1b 0%, #061017 100%)'
            }
          };
          var cfg = map[th];
          if (cfg) {
            var ph = document.getElementById('ph');
            var wl = document.getElementById('ph-wall');
            ph.classList.add(cfg.cls);
            ph.style.setProperty('--gblue', cfg.accent);
            if (wl) wl.style.background = cfg.wall;
          }
        } catch (e) {}
      })();
    </script>

    <div class="isl" id="isl-pill" data-act="app" data-id="markas" role="button" tabindex="0" title="Buka Markas" style="display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;cursor:pointer;overflow:hidden">
      <span id="isl-dot" style="width:6px;height:6px;border-radius:50%;background:#34C759;box-shadow:0 0 8px #34C759;flex:none"></span>
      <span id="isl-txt" style="font-size:10.5px;font-weight:700;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em">PUNKSHIT.OS</span>
    </div>

    <!-- iOS Status Bar -->
    <div class="sb">
      <b id="clk">9:41</b>
      <span>
        <span id="sync-dot" class="sync-dot" title="Status Koneksi Server"></span>
        <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"><path d="M1.5 4.2a10 10 0 0114 0M4 7a6.4 6.4 0 019 0"/><circle cx="8.5" cy="10" r="1.2" fill="#fff"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="3.8" fill="none" stroke="#fff" opacity=".4"/><rect x="2" y="2" width="19" height="9" rx="2.5" fill="#fff"/><path d="M24 4.5v4c1-.3 1.8-1.1 1.8-2s-.8-1.7-1.8-2z" fill="#fff" opacity=".5"/></svg>
      </span>
    </div>

    <!-- Mas Raka Live Notification Banner -->
    <div class="ban glass" id="ban"></div>

    <!-- Home Screen -->
    <main class="home" id="home">
      <div class="wd">
        <div class="w glass" data-act="app" data-id="kas" role="button" tabindex="0">
          <small>DOMPET PSC</small>
          <b id="wp">0</b>
          <p id="ws">Streak 0 hari</p>
        </div>
        <div class="w glass" data-act="app" data-id="warga" role="button" tabindex="0">
          <small>MASIH HIDUP</small>
          <div class="faces" id="wf"></div>
          <p id="wc">Memuat warga...</p>
        </div>
      </div>

      <!-- App Icons Grid -->
      <div class="grid" id="grid"></div>

      <button class="srch glass" data-act="search">⌕ Cari Warga atau Fitur...</button>
      <div class="dots"><i></i><i></i></div>

      <!-- Bottom Dock -->
      <nav class="dock glass" id="dock"></nav>
    </main>

    <!-- Fullscreen App Container -->
    <section class="av" id="av">
      <div class="nav" id="nav">
        <button class="bk" data-act="close">
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#4d9bff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"/></svg>
          Home
        </button>
        <span class="nt" id="nt"></span>
        <div id="nav-extra"></div>
      </div>
      <div class="sc" id="sc">
        <h1 class="lt" id="lt"></h1>
        <div id="bd"></div>
      </div>
    </section>

    <!-- Modal Bottom Sheet -->
    <div class="scrim" id="scr" data-act="shut"></div>
    <section class="sh" id="sh" role="dialog" aria-modal="true"></section>

    <!-- Home Indicator -->
    <div class="hi"></div>
  </div>
