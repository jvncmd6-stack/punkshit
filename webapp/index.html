function g3(g,s,drag){var L='',i,t;for(i=0;i<10;i++){t=Math.round(i/9*100);L+='<svg viewBox="0 0 100 100" style="transform:translateZ(calc(var(--s)*'+((i-4.5)*.014).toFixed(3)+'))"><path d="'+g.d+'" fill="color-mix(in srgb,'+g.c[0]+' '+t+'%,'+g.c[1]+')"'+(i==9?' stroke="#fff" stroke-opacity=".75" stroke-width="2.5" stroke-linejoin="round"':'')+'/></svg>'}
return'<div class="g3" '+(drag?'data-d ':'')+'style="--s:'+s+'px;--gl:'+g.c[1]+'99"><div class="rot">'+L+'</div></div>'}
function drag(r){r.querySelectorAll('.g3[data-d]').forEach(function(g){var o=g.firstChild,x,y,ry=0,rx=0,on=0,tm;g.onpointerdown=function(e){on=1;x=e.clientX;y=e.clientY;clearTimeout(tm);o.style.animation='none';g.setPointerCapture(e.pointerId)};g.onpointermove=function(e){if(!on)return;ry+=(e.clientX-x)*.9;rx-=(e.clientY-y)*.9;x=e.clientX;y=e.clientY;o.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)'};g.onpointerup=g.onpointercancel=function(){on=0;tm=setTimeout(function(){o.style.animation='';o.style.transform=''},2500)}})}
function gf(id){return GF.filter(function(g){return g.id===id})[0]}
var timer;function ban(who,tag,txt){var b=$('ban');b.innerHTML=ico('markas').replace('class="ic"','class="ic" aria-hidden="true"')+'<div><b>'+who+'<em>'+tag+'</em></b><span>'+esc(txt)+'</span></div>';b.firstChild.style.cssText='--a:#FFD633;--b:#c28a00';b.firstChild.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 3v3M5 9h14v9a2 2 0 01-2 2H7a2 2 0 01-2-2zM9 13h.01M15 13h.01M9 16.5h6"/></svg>';b.classList.add('on');clearTimeout(timer);timer=setTimeout(function(){b.classList.remove('on')},4200)}
function bot(type,data,text){S.feed.unshift({t:Date.now(),x:text});S.feed=S.feed.slice(0,8);save();
/* BRIDGE: kirim ke backend -> bot Mas Raka -> posting ke grup. Ganti API dgn URL server.
 fetch(API+'/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:type,data:data,initData:tg&&tg.initData})}) */
if(window.API){try{fetch(window.API+'/api/event',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'tma '+(tg&&tg.initData||'')},body:JSON.stringify({type:type,data:data})}).catch(function(){})}catch(e){}}
ban('Mas Raka','→ Grup Punkshit',text)}
function home(){$('grid').innerHTML=GRID.map(function(i){return tile(i)}).join('');$('dock').innerHTML=DOCK.map(function(i){return tile(i,1)}).join('');$('wp').textContent=S.psc;$('ws').textContent='Streak '+S.streak+' hari';
$('wf').innerHTML=['#FFD633','#8FC7FF','#34C759','#FF9ad5','#c8b6ff'].map(function(c,i){return'<i style="background:'+c+'">'+'JRKMA'[i]+'</i>'}).join('')}
function tile(id,d){return'<button class="app" data-act="app" data-id="'+id+'" aria-label="'+IC[id][0]+'">'+ico(id)+(d?'':'<span>'+IC[id][0]+'</span>')+'</button>'}
function sheet(h){$('sh').innerHTML='<div class="grab"></div>'+h;$('sh').classList.add('open');$('scr').classList.add('open');drag($('sh'))}
function shut(){$('sh').classList.remove('open');$('scr').classList.remove('open')}
function reg(){sheet('<h1>NEW CHARACTER UNLOCKED!</h1><p class="sub">Wih, ada yang nyasar. Bikin <i>PunkID</i> dulu biar resmi jadi Warga Punkshit. Tenang, ini bukan SIM.</p><label for="nk">NAMA TONGKRONGAN</label><input id="nk" maxlength="16" placeholder="mis. Jex" autocomplete="off"><button class="btn" data-act="reg">BIKIN PUNKID</button>');try{var u=tg&&tg.initDataUnsafe.user;if(u)$('nk').value=(u.first_name||'').slice(0,16)}catch(e){}}
function today(){return new Date().toDateString()}
function bonus(n){var b=n<4?2:n<7?3:n<14?5:n<30?7:n<60?10:15;return b+(n%7==0?25:0)}
var V={
markas:function(){var done=S.last===today();return'<div class="grp"><div class="rw"><div><b>Absen Nyawa</b><small>Streak '+S.streak+' hari · terbaik '+S.best+'</small></div><button class="pill" data-act="absen"'+(done?' disabled':'')+'>'+(done?'SUDAH':'ABSEN')+'</button></div></div><h3 class="gh">PESAN MAS RAKA KE GRUP</h3><div class="grp">'+(S.feed.length?S.feed.map(function(f){return'<div class="rw"><div>'+esc(f.x)+'<small>'+new Date(f.t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+' · terkirim lewat bot</small></div></div>'}).join(''):'<div class="rw"><small>Belum ada. Absen atau kirim gift buat mancing Mas Raka.</small></div>')+'</div>'},
lapak:function(){return'<p class="bal">Saldo <b>'+S.psc+' PSC</b> · Gift lo: '+S.inv.length+'</p><div class="gg">'+GF.map(function(g){return'<button class="gc" data-act="gift" data-id="'+g.id+'">'+g3(g,84)+'<b>'+g.n+'</b><small>'+g.r+'</small><span class="pr">'+g.p+' PSC</span></button>'}).join('')+'</div>'},
kas:function(){return card(S.u)+'<p class="bal">Saldo <b>'+S.psc+' PSC</b> · tap kartu buat diputar</p><div class="grp"><div class="rw"><div>Riwayat transaksi<small>Segera hadir, nunggu database</small></div></div></div>'},
gue:function(){var u=S.u,p=u.pin>=0&&S.inv[u.pin]?gf(S.inv[u.pin].g):null;return'<div class="pc"><div class="cv" style="background:'+BG[u.bg]+'">'+(p?g3(p,96,1):'')+'</div><div class="pb"><div class="ring r'+u.bd+'"><span>'+esc(u.name[0].toUpperCase())+'</span></div><div class="nm">'+esc(u.name)+'</div><div class="hd">'+u.no+' · 🌱 Mayat Baru</div>'+(u.bio?'<p class="bio">'+esc(u.bio)+'</p>':'')+(u.sp?'<a class="sp" href="'+esc(u.sp)+'" target="_blank" rel="noopener noreferrer">♫ Spotify</a>':'')+'<button class="btn b2" data-act="edit">Edit Profil</button></div></div><h3 class="gh">KOLEKSI GIFT · tap buat dipasang</h3>'+(S.inv.length?'<div class="hs">'+S.inv.map(function(x,i){return'<button data-act="pin" data-i="'+i+'" class="'+(u.pin===i?'on':'')+'">'+g3(gf(x.g),64)+gf(x.g).n+'</button>'}).join('')+'</div>':'<div class="grp"><div class="rw"><small>Kosong. Beli di Lapak atau dapet dari warga lain.</small></div></div>')}};
function card(u){var dg=u.no.slice(4),nm=esc(u.name.toUpperCase());return'<div class="flip" data-act="flip" role="button" tabindex="0" aria-label="Kartu PunkID. Tap untuk memutar"><div class="cd"><div class="fc"><div class="cr"><b class="br">PUNKSHIT.OS</b><span>PUNKID</span></div><div class="cr"><div class="chp"></div><span style="font-size:22px;opacity:.8">)))</span></div><div><div class="cn">PSK '+dg+' •••• ••••</div><div class="cr"><b>'+nm+'</b><small>SALDO '+S.psc+' PSC</small></div></div></div><div class="fc fb"><div class="mag"></div><div class="sig">'+esc(u.name)+'</div><div class="stt"><div><b>'+S.streak+'</b>Streak</div><div><b>'+S.best+'</b>Terbaik</div><div><b>'+S.inv.length+'</b>Gift</div><div><b>0</b>Cred</div></div><div class="tn">Bukan SIM, bukan ATM. Tap buat balik.</div></div></div></div>'}
function ph(id){return'<div class="emp">'+ico(id)+'Modul ini belum dibuka di prototipe.</div>'}
function open(id,el){if(!S.u){$('home').classList.remove('shake');void $('home').offsetWidth;$('home').classList.add('shake');return reg()}
cur=id;var v=$('av');if(el){var a=el.getBoundingClientRect(),p=$('ph').getBoundingClientRect();v.style.transformOrigin=(a.left+a.width/2-p.left)+'px '+(a.top+a.height/2-p.top)+'px'}
$('lt').textContent=$('nt').textContent=IC[id][0];$('bd').innerHTML=(V[id]||ph)(id);drag($('bd'));$('sc').scrollTop=0;$('nav').classList.remove('s');v.classList.add('open');$('home').classList.add('bk')}
function refresh(){if(cur&&V[cur]){$('bd').innerHTML=V[cur]();drag($('bd'))}home()}
$('sc').onscroll=function(){$('nav').classList.toggle('s',$('sc').scrollTop>34)};
function giftSheet(g){sheet('<div style="display:grid;place-items:center">'+g3(g,170,1)+'</div><h2>'+g.n+'</h2><p class="sub">'+g.r+' · '+g.t+'<br>Putar pakai jari.</p><button class="btn" data-act="buy" data-id="'+g.id+'">Beli buat gue · '+g.p+' PSC</button><button class="btn b2" data-act="tog">Kirim ke warga</button><div id="sf" hidden><label>PENERIMA</label><input id="to" placeholder="@username" maxlength="24"><input id="ms" placeholder="Pesan (opsional)" maxlength="60"><button class="btn" data-act="send" data-id="'+g.id+'">Kirim · '+g.p+' PSC</button></div>')}
function pay(g){if(S.psc<g.p){ban('Mas Raka','Sistem','Saldo kurang. Dompet lu lagi cosplay gurun Sahara. Absen dulu.');return 0}S.psc-=g.p;return 1}
document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t)return;var a=t.getAttribute('data-act'),id=t.getAttribute('data-id'),g=id&&gf(id);
if(a==='app')open(id,t);else if(a==='close'){$('av').classList.remove('open');$('home').classList.remove('bk');cur=''}else if(a==='shut')shut();
else if(a==='reg'){var n=$('nk').value.trim();if(n.length<2)return;S.u={name:n,no:'PSK-'+(1000+Math.floor(Math.random()*9000)),bio:'',sp:'',bg:0,bd:1,pin:-1};S.psc=110;save();shut();home();bot('join',{n:n},'NEW CHARACTER UNLOCKED! '+n+' resmi jadi warga. Good luck, rookie.');setTimeout(function(){open('gue',document.querySelector('[data-id=gue]'))},700)}
else if(a==='absen'){if(S.last===today())return;var y=new Date(Date.now()-864e5).toDateString();S.streak=S.last===y?S.streak+1:1;S.best=Math.max(S.best,S.streak);S.last=today();var b=bonus(S.streak);S.psc+=b;save();bot('absen',{s:S.streak},'MASIH HIDUP TERNYATA. '+S.u.name+' absen hari ke-'+S.streak+' (+'+b+' PSC).');refresh()}
else if(a==='gift')giftSheet(g);else if(a==='tog')$('sf').hidden=!$('sf').hidden;
else if(a==='buy'){if(!pay(g))return;S.inv.push({g:g.id});if(S.u.pin<0)S.u.pin=S.inv.length-1;save();shut();bot('buy',{g:g.id},S.u.name+' baru beli '+g.n+'. Dompet berkurang, gaya bertambah.');refresh()}
else if(a==='send'){var to=$('to').value.trim().replace(/^@?/,'@');if(to.length<3)return;if(!pay(g))return;var m=$('ms').value.trim();save();shut();bot('gift',{g:g.id,to:to,m:m},S.u.name+' ngirim '+g.n+' ke '+to+'!'+(m?' "'+m+'"':''));refresh()}
else if(a==='flip')t.classList.toggle('on');else if(a==='pin'){S.u.pin=+t.getAttribute('data-i');save();refresh()}
else if(a==='edit'){var u=S.u;E={bg:u.bg,bd:u.bd};sheet('<h2 style="margin-bottom:6px">Edit Profil</h2><label>BIO</label><input id="bi" maxlength="80" value="'+esc(u.bio)+'" placeholder="Tulis bio lo"><label>LINK SPOTIFY</label><input id="sl" value="'+esc(u.sp)+'" placeholder="https://open.spotify.com/..."><label>LATAR PROFIL</label><div class="chips">'+BGN.map(function(n,i){return'<button class="chip'+(i==E.bg?' on':'')+'" data-act="pk" data-k="bg" data-i="'+i+'">'+n+'</button>'}).join('')+'</div><label>BORDER</label><div class="chips">'+BDN.map(function(n,i){return'<button class="chip'+(i==E.bd?' on':'')+'" data-act="pk" data-k="bd" data-i="'+i+'">'+n+'</button>'}).join('')+'</div><button class="btn" data-act="sv">SIMPAN</button>')}
else if(a==='pk'){var k=t.getAttribute('data-k');E[k]=+t.getAttribute('data-i');t.parentNode.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('on',c===t)})}
else if(a==='sv'){var s=$('sl').value.trim();if(s&&!/^https:\/\/open\.spotify\.com\/(track|album|playlist|artist|user|episode)\/[\w-]+/.test(s)){$('sl').style.borderColor='#FF453A';return}S.u.bio=$('bi').value.trim();S.u.sp=s;S.u.bg=E.bg;S.u.bd=E.bd;save();shut();refresh()}});
document.addEventListener('keydown',function(e){var f=e.target.classList&&e.target.classList.contains('flip');if(f&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.classList.toggle('on')}});
function tick(){var d=new Date();$('clk').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
tick();setInterval(tick,20000);try{if(tg){tg.ready();tg.expand()}}catch(e){}
home();if(!S.u)setTimeout(reg,500)
})();
</script></body></html>
